<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <!--   A tag contain a element called "href" (hr - hypertext rf - reference) -->
    <!--  Clickable text made by a tag -->
    <h1>1.Forms</h1>
    <div>


        <form action="Welcomepage.html" target="_blank">
            <fieldset>
                <legend>Enter your basic Information</legend>
                <label for="fullname">Fullname :</label>
                <input type="text" id="fullname" placeholder="Enter your Name" required>
                <br><br>
                <label for="email">Email :</label>
                <input type="email" id="email" placeholder="Enter Your Email" required>
                <br><br>
                <label for="password">Password :</label>
                <input type="password" id="password" placeholder="Enter Your Password" required minlength="8">
                <br><br>
                <label for="checkbox">Are You Sure ? :</label>
                <input type="checkbox" id="checkbox" required>
                <br><br>
                <label for="no.">Number :</label>
                <input type="number" id="no." placeholder="Enter Phone number" required min="0">
                <br><br>
                <label for="radio">Gender :</label>
                <label for="radio">male </label>
                <input type="radio" id="radio" name="gender" required>
                <label for="female">female</label>
                <input type="radio" id="female" name="gender" required>
                <br><br>
                <label for="Date">Date :</label>
                <input type="Date" id="Date" placeholder="Enter Your DOB" required>
                <br><br>
                <label for="file">Files :</label>
                <input type="file" id="file">
                <br><br>
                <label for="file">Select your City :</label>
                <select name="" id="city" required>
                    <option value="Delhi" selected>Delhi</option>
                    <option value="haryana">Haryana</option>
                    <option value="himachal pradesh">Himachal Pradesh</option>
                    <option value="jharkhand">Jharkhand</option>
                    <option value="kerela">Kerala</option>
                </select>
                <br><br>
                <button type="submit">Submit Form</button>
                <br><br>




            </fieldset>
        </form>


    </div>


</body>

</html>
